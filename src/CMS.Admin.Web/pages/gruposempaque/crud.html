<div ng-app="app" ng-controller="GruposEmpaqueCRUDController">
    <div class="container-fluid">
        <div class="row">
            <div class="col-sm-12 col-md-12">
                <ol class="breadcrumb pull-right">
                    <li><a href="/#/blsp/dashboard">Home</a></li>
                    <li><a ui-sref="blsp.gruposempaque.list">Grupos Empaque</a></li>
                    <li class="active">{{PageTitle}}</li>
                </ol>
                <h1 class="page-header">{{PageTitle}}<small></small></h1>
            </div>
            <div class="col-sm-12 col-md-12">
                <div ng-model="successMessage" class="alert alert-success" role="alert" ng-show="successMessage">{{ successMessage }}</div>
                <div ng-model="errorMessage" class="alert alert-danger" role="alert" ng-show="errorMessage">{{ errorMessage }}</div>
            </div>
            <form ng-submit="editForm.$valid && processForm()" class="form-horizontal" role="form" name="editForm" novalidate>
                <div class="col-sm-12 col-md-8">
                    <div class="panel panel-inverse">
                        <div class="panel-heading">
                            <h4 class="panel-title">Informaci&oacute;n del Grupo</h4>
                        </div>
                        <md-content layout-padding>
                            <div layout-gt-xs="row">
                                <md-input-container class="md-block" flex-gt-xs>
                                    <label>Descripci&oacute;n</label>
                                    <input type="text" ng-model="grupoEmpaqueData.Descripcion" name="Descripcion" required />
                                    <div ng-messages="editForm.Descripcion.$error">
                                        <div ng-messages-include="pages/validation/text.html"></div>
                                    </div>
                                </md-input-container>
                            </div>

                            <div layout-gt-xs="row">
                                <md-input-container class="md-block" flex-gt-xs>
                                    <md-switch ng-model="grupoEmpaqueData.EtiquetaInterna" aria-label="EtiquetaInterna" ng-change="onToggleChange('EtiquetaInterna')">
                                        Lleva etiqueta interna?
                                    </md-switch>
                                </md-input-container>
                                <md-input-container class="md-block" flex-gt-xs>
                                    <label>Tipo etiqueta interna</label>
                                    <input type="number" min="0" step="1" ng-disabled="!grupoEmpaqueData.EtiquetaInterna" ng-model="grupoEmpaqueData.TipoEtiquetaInterna" name="TipoEtiquetaInterna" required />
                                </md-input-container>
                            </div>

                            <div layout-gt-xs="row">
                                <md-input-container class="md-block" flex-gt-xs>
                                    <md-switch ng-model="grupoEmpaqueData.EtiquetaExterna" aria-label="EtiquetaExterna" ng-change="onToggleChange('EtiquetaExterna')">
                                        Lleva etiqueta externa?
                                    </md-switch>
                                </md-input-container>
                                <md-input-container class="md-block" flex-gt-xs>
                                    <label>Tipo etiqueta externa</label>
                                    <input type="number" min="0" step="1" ng-disabled="!grupoEmpaqueData.EtiquetaExterna" ng-model="grupoEmpaqueData.TipoEtiquetaExterna" name="TipoEtiquetaExterna" required />
                                </md-input-container>
                            </div>

                            <div layout-gt-xs="row">
                                <md-input-container class="md-block" flex-gt-xs>
                                    <label>Tipo etiqueta pallet</label>
                                    <input type="number" min="0" step="1" ng-model="grupoEmpaqueData.TipoEtiquetaPallet" name="TipoEtiquetaPallet" required />
                                </md-input-container>
                                <md-input-container class="md-block" flex-gt-xs>
                                    <md-switch ng-model="grupoEmpaqueData.Habilitado" aria-label="Habilitado">
                                        Habilitado
                                    </md-switch>
                                </md-input-container>
                            </div>
                        </md-content>
                    </div>
                </div>
                <div class="col-sm-12 col-md-4">
                    <div class="panel panel-inverse">
                        <div class="panel-heading">
                            <h4 class="panel-title">Acciones</h4>
                        </div>
                        <div class="panel-body">
                            <button class="btn btn-block btn-primary" type="submit" ng-disabled="!editForm.$valid">{{SubmitButton}}</button>
                            <button class="btn btn-block btn-danger" type="button" ng-click="deleteGrupoEmpaque($event, grupoEmpaqueData.IDGrupoEmpaque || grupoEmpaqueData.Id || grupoEmpaqueData.IdGrupoEmpaque);" ng-show="grupoEmpaqueData.IDGrupoEmpaque || grupoEmpaqueData.Id || grupoEmpaqueData.IdGrupoEmpaque">Borrar Grupo</button>
                            <a class="btn btn-block btn-default" ui-sref="blsp.gruposempaque.list">Volver</a>
                        </div>
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>
